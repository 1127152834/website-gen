# Windows 安装包（npm run dist → release/）。个人工具：按用户安装、不需要管理员权限、不签名（首次运行 SmartScreen 会提示）。
appId: com.chutlong821.website-gen
productName: 独立站 AI 工厂
directories:
  output: release
files:
  - out/**
  # 主题和伴侣插件模板：Hostinger MCP 子进程直接按真实路径读取它们上传
  - resources/**
  - package.json
# 不打 asar：MCP 子进程（ELECTRON_RUN_AS_NODE）、主题/插件目录部署、playwright 都需要真实文件路径
asar: false
# 没有原生模块（SQLite 用 Node 内置的 node:sqlite）
npmRebuild: false
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: website-gen-setup-${version}.${ext}
  shortcutName: 独立站 AI 工厂
